name: oxipress
description: "OxiPress — cross-platform desktop editor for Hugo sites."
publish_to: 'none'
version: 1.0.0+1

environment:
  sdk: ^3.11.5

dependencies:
  cupertino_icons: ^1.0.8
  file_picker: ^11.0.1
  flutter:
    sdk: flutter
  flutter_localizations:
    sdk: flutter
  flutter_riverpod: ^3.3.1
  intl: ^0.20.2
  logging: ^1.3.0
  multi_split_view: ^3.5.0
  path: ^1.9.0
  path_provider: ^2.1.5
  shared_preferences: ^2.5.5
  toml: ^0.16.0
  url_launcher: ^6.3.1
  watcher: ^1.1.1
  webview_flutter: ^4.10.0
  webview_flutter_wkwebview: ^3.18.0
  window_manager: ^0.5.1
  yaml: ^3.1.3

dev_dependencies:
  flutter_lints: ^6.0.0
  flutter_test:
    sdk: flutter
  integration_test:
    sdk: flutter
  mocktail: ^1.0.4

flutter:
  uses-material-design: true
  generate: true
