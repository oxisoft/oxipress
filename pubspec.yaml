name: oxipress
description: "OxiPress — cross-platform desktop editor for Hugo sites."
publish_to: 'none'
version: 0.0.1+1

environment:
  sdk: ^3.11.5

dependencies:
  cupertino_icons: ^1.0.8
  flutter:
    sdk: flutter
  flutter_localizations:
    sdk: flutter
  flutter_riverpod: ^3.3.1
  intl: ^0.20.2
  logging: ^1.3.0
  path: ^1.9.0
  path_provider: ^2.1.5
  shared_preferences: ^2.5.5
  window_manager: ^0.5.1

dev_dependencies:
  flutter_lints: ^6.0.0
  flutter_test:
    sdk: flutter
  integration_test:
    sdk: flutter
  mocktail: ^1.0.4

flutter:
  uses-material-design: true
  generate: true
  assets:
    - assets/themes/
