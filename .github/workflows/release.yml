name: Release

on:
  push:
    tags:
      - 'v*'

permissions:
  contents: write

env:
  FLUTTER_VERSION: '3.41.9'

jobs:
  verify-tag:
    name: Verify tag matches pubspec
    runs-on: ubuntu-latest
    outputs:
      version: ${{ steps.check.outputs.version }}
      is_prerelease: ${{ steps.check.outputs.is_prerelease }}
    steps:
      - uses: actions/checkout@v4

      - name: Compare tag with pubspec version
        id: check
        shell: bash
        run: |
          TAG="${GITHUB_REF#refs/tags/}"
          TAG_VERSION="${TAG#v}"
          PUBSPEC_VERSION=$(grep '^version:' pubspec.yaml | head -1 | awk '{print $2}' | cut -d'+' -f1)
          echo "tag       : $TAG_VERSION"
          echo "pubspec   : $PUBSPEC_VERSION"
          if [ "$TAG_VERSION" != "$PUBSPEC_VERSION" ]; then
            echo "::error::Tag version ($TAG_VERSION) does not match pubspec version ($PUBSPEC_VERSION). Bump pubspec.yaml or retag, then push again."
            exit 1
          fi
          echo "version=$TAG_VERSION" >> "$GITHUB_OUTPUT"
          if [[ "$TAG_VERSION" == *-* ]]; then
            echo "is_prerelease=true" >> "$GITHUB_OUTPUT"
          else
            echo "is_prerelease=false" >> "$GITHUB_OUTPUT"
          fi

  build:
    name: Build (${{ matrix.target }})
    needs: verify-tag
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-latest
            target: linux
            artifact-name: oxipress-linux-x64
          - os: macos-latest
            target: macos
            artifact-name: oxipress-macos
          - os: windows-latest
            target: windows
            artifact-name: oxipress-windows-x64
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4

      - name: Install Linux desktop dependencies
        if: matrix.target == 'linux'
        run: |
          sudo apt-get update -y
          sudo apt-get install -y ninja-build libgtk-3-dev clang cmake pkg-config

      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          flutter-version: ${{ env.FLUTTER_VERSION }}
          cache: true

      - name: Pub get
        run: flutter pub get

      - name: Generate l10n
        run: flutter gen-l10n

      - name: Build ${{ matrix.target }}
        run: flutter build ${{ matrix.target }} --release

      - name: Package Linux
        if: matrix.target == 'linux'
        shell: bash
        run: |
          mkdir -p dist
          STAGE="oxipress-${{ needs.verify-tag.outputs.version }}-linux-x64"
          cp -r build/linux/x64/release/bundle "$STAGE"
          tar czf "dist/${{ matrix.artifact-name }}-${{ needs.verify-tag.outputs.version }}.tar.gz" "$STAGE"

      - name: Package macOS
        if: matrix.target == 'macos'
        shell: bash
        run: |
          mkdir -p dist
          cd build/macos/Build/Products/Release
          zip -ry "${{ github.workspace }}/dist/${{ matrix.artifact-name }}-${{ needs.verify-tag.outputs.version }}.zip" oxipress.app

      - name: Package Windows
        if: matrix.target == 'windows'
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force -Path dist | Out-Null
          $stage = "oxipress-${{ needs.verify-tag.outputs.version }}-windows-x64"
          Copy-Item -Recurse "build/windows/x64/runner/Release" $stage
          $zip = "dist/${{ matrix.artifact-name }}-${{ needs.verify-tag.outputs.version }}.zip"
          Compress-Archive -Path $stage -DestinationPath $zip

      - uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.artifact-name }}
          path: dist/*
          if-no-files-found: error

  release:
    name: Publish GitHub release
    needs: [verify-tag, build]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/download-artifact@v4
        with:
          path: dist
          merge-multiple: true

      - name: List artifacts
        run: ls -la dist/

      - name: Create release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ github.ref_name }}
          name: ${{ github.ref_name }}
          generate_release_notes: true
          prerelease: ${{ needs.verify-tag.outputs.is_prerelease == 'true' }}
          files: dist/*
          fail_on_unmatched_files: true
